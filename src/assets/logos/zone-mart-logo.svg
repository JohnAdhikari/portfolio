<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- eCommerce Logo - Shopping Bag Style -->
  <defs>
    <linearGradient id="ecomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8E53;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="100" cy="100" r="100" fill="url(#ecomGrad)"/>
  
  <!-- Shopping bag -->
  <path d="M 65 75 L 65 145 Q 65 155 75 155 L 125 155 Q 135 155 135 145 L 135 75 Z" 
        fill="none" stroke="white" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Bag handle -->
  <path d="M 80 75 Q 80 55 100 55 Q 120 55 120 75" 
        fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Smile/checkmark accent -->
  <circle cx="90" cy="110" r="3" fill="white"/>
  <circle cx="110" cy="110" r="3" fill="white"/>
  <path d="M 85 120 Q 100 130 115 120" 
        fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>